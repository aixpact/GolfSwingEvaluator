<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golf Swing Analyser</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SwingAnalyser">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            background-color: #1c1c1e;
            color: white;
            overflow-x: hidden;
        }

        /* ── Status / API key bar ── */
        #statusBar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            flex-shrink: 0;
        }
        .status-dot.ready  { background: #32d74b; }
        .status-dot.error  { background: #ff6b6b; }
        .key-btn {
            background: none;
            border: 1px solid #555;
            color: #aaa;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .key-btn:hover { border-color: #888; color: #ddd; }
        #keyPanel {
            background: #2c2c2e;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        #apiKeyInput {
            flex: 1;
            background: #1c1c1e;
            border: 1px solid #555;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            padding: 6px 10px;
            font-family: monospace;
        }
        #apiKeyInput::placeholder { color: #555; }
        #saveKeyBtn {
            background: #0a84ff;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        #saveKeyBtn:hover { background: #0060d1; }

        /* ── Video area ── */
        .video-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
        }
        .video-wrapper {
            width: 50%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        canvas {
            width: 100%;
            border-radius: 8px;
            background-color: #000;
        }
        .hidden-video {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 10px;
            height: 10px;
            z-index: -1;
        }

        /* ── Per-video scrub row ── */
        .micro-scrub-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            justify-content: center;
        }
        .micro-btn {
            background-color: #3a3a3c;
            font-size: 12px;
            padding: 8px;
            flex: 0 0 32px;
            border-radius: 6px;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .micro-btn:active   { background-color: #4c4c4e; }
        .micro-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── Buttons ── */
        .upload-section { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        input[type="file"] { display: none; }
        .btn {
            background-color: #0a84ff;
            color: white;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            flex: 1;
            border: none;
        }
        .btn:active   { background-color: #0060d1; }
        .btn:disabled { background-color: #3a3a3c; color: #666; cursor: not-allowed; }

        /* ── Master controls ── */
        .master-controls {
            margin-top: 15px;
            background-color: #2c2c2e;
            padding: 15px;
            border-radius: 12px;
        }
        .master-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        #timer {
            font-family: monospace;
            font-size: 28px;
            font-weight: bold;
            color: #32d74b;
            margin: 0;
        }
        .reset-btn {
            background-color: #ff453a;
            flex: 0 0 auto;
            padding: 8px 16px;
        }
        .reset-btn:active { background-color: #d70015; }

        .master-label {
            font-size: 12px;
            font-weight: bold;
            color: #888;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .scrub-row {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }
        .icon-btn {
            background-color: #3a3a3c;
            font-size: 18px;
            padding: 10px;
            flex: 0 0 50px;
            border-radius: 8px;
            border: none;
            color: white;
            cursor: pointer;
        }
        .icon-btn:active   { background-color: #4c4c4e; }
        .icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── Jog wheel ── */
        .jog-wheel {
            position: relative;
            flex-shrink: 0;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, #606064, #3a3a3c 48%, #1a1a1c);
            border: 2px solid #505054;
            box-shadow:
                0 6px 18px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(255,255,255,0.12),
                inset 0 -2px 4px rgba(0,0,0,0.5);
            cursor: not-allowed;
            user-select: none;
            touch-action: none;
            opacity: 0.4;
            transition: opacity 0.2s, box-shadow 0.15s;
        }
        .jog-wheel.enabled {
            cursor: grab;
            opacity: 1;
        }
        .jog-wheel.enabled:active {
            cursor: grabbing;
            box-shadow:
                0 2px 8px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(255,255,255,0.12),
                inset 0 -2px 4px rgba(0,0,0,0.5);
        }
        .wheel-dot {
            position: absolute;
            top: 9px;
            left: calc(50% - 3px);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #0a84ff;
            box-shadow: 0 0 8px rgba(10,132,255,0.8);
        }
        .jog-wheel:not(.enabled) .wheel-dot {
            background: #555;
            box-shadow: none;
        }
        .master-jog-wheel {
            width: 90px;
            height: 90px;
        }
        .master-jog-wheel .wheel-dot {
            top: 11px;
        }

        /* ── Drawing overlay ── */
        .canvas-wrapper {
            position: relative;
            line-height: 0;
        }
        .draw-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            pointer-events: auto;
            cursor: grab;
            z-index: 2;
            background: transparent;
        }
        .draw-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            background-color: #2c2c2e;
            border-radius: 10px;
            padding: 10px 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .draw-btn {
            background-color: #3a3a3c;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .draw-btn:active { background-color: #4c4c4e; }
        .draw-btn.active { background-color: #0a84ff; }
        .draw-clear-btn { background-color: #ff453a; }
        .draw-clear-btn:active { background-color: #d70015; }
        .draw-toolbar input[type="color"] {
            width: 36px;
            height: 34px;
            border: none;
            border-radius: 6px;
            padding: 2px;
            background: #3a3a3c;
            cursor: pointer;
        }
        .draw-toolbar input[type="range"] {
            width: 70px;
            accent-color: #0a84ff;
        }
        .draw-label {
            font-size: 12px;
            color: #888;
        }

        /* ── Analyse button ── */
        .analyse-btn {
            margin-top: 14px;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 12px;
            background-color: #30d158;
            color: #000;
        }
        .analyse-btn:active   { background-color: #25a244; }
        .analyse-btn:disabled { background-color: #3a3a3c; color: #666; cursor: not-allowed; }

        /* ── Progress panel ── */
        #progressPanel {
            margin-top: 14px;
            background-color: #2c2c2e;
            border-radius: 12px;
            padding: 14px;
            text-align: left;
        }
        #progressStep {
            font-size: 13px;
            color: #ccc;
            margin-bottom: 10px;
        }
        .progress-track {
            background-color: #3a3a3c;
            border-radius: 4px;
            height: 6px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #0a84ff;
            border-radius: 4px;
            width: 0%;
            transition: width 0.2s ease;
        }

        /* ── Feedback panel ── */
        #feedbackPanel {
            margin-top: 14px;
            background-color: #2c2c2e;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
        }
        #feedbackPanel h4 {
            margin: 0 0 10px;
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #feedbackText {
            font-size: 15px;
            line-height: 1.6;
            color: #e5e5ea;
        }
        .feedback-error {
            color: #ff6b6b;
            font-size: 13px;
        }
        .feedback-error code {
            background: #3a3a3c;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Claude API key status -->
    <div id="statusBar">
        <span id="apiDot" class="status-dot"></span>
        <span id="apiLabel">No API key</span>
        <button id="keyToggleBtn" class="key-btn">Set key</button>
    </div>

    <!-- API key input panel (shown/hidden by toggle) -->
    <div id="keyPanel" style="display:none">
        <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-…" autocomplete="off" spellcheck="false">
        <button id="saveKeyBtn">Save</button>
    </div>

    <h3 style="margin: 4px 0 10px;">Swing Analyser</h3>

    <div class="upload-section">
        <label for="upload1" class="btn">Upload Swing 1</label>
        <input type="file" id="upload1" accept="video/*">

        <label for="upload2" class="btn">Upload Swing 2</label>
        <input type="file" id="upload2" accept="video/*">
    </div>

    <div class="video-container">
        <div class="video-wrapper">
            <div class="canvas-wrapper">
                <canvas id="canvas1"></canvas>
                <canvas id="drawCanvas1" class="draw-canvas"></canvas>
            </div>
            <video id="vid1" class="hidden-video" playsinline muted></video>
            <div class="micro-scrub-row">
                <button id="prevFrameBtn1" class="micro-btn" disabled>◀</button>
                <div class="jog-wheel" id="jogWheel1"><div class="wheel-dot"></div></div>
                <button id="nextFrameBtn1" class="micro-btn" disabled>▶</button>
            </div>
        </div>

        <div class="video-wrapper">
            <div class="canvas-wrapper">
                <canvas id="canvas2"></canvas>
                <canvas id="drawCanvas2" class="draw-canvas"></canvas>
            </div>
            <video id="vid2" class="hidden-video" playsinline muted></video>
            <div class="micro-scrub-row">
                <button id="prevFrameBtn2" class="micro-btn" disabled>◀</button>
                <div class="jog-wheel" id="jogWheel2"><div class="wheel-dot"></div></div>
                <button id="nextFrameBtn2" class="micro-btn" disabled>▶</button>
            </div>
        </div>
    </div>

    <div class="draw-toolbar">
        <button id="drawModeBtn" class="draw-btn">✏️ Draw</button>
        <input type="color" id="strokeColor" value="#ff3b30" title="Stroke color">
        <span class="draw-label">Size</span>
        <input type="range" id="strokeWidth" min="1" max="20" value="4" title="Stroke width">
        <button id="clearDrawBtn" class="draw-btn draw-clear-btn">✕ Clear</button>
        <button id="resetViewBtn" class="draw-btn">↺ Reset</button>
    </div>

    <div class="master-controls">
        <div class="master-header">
            <div id="timer">00:00.00</div>
            <button id="resetBtn" class="btn reset-btn" disabled>Reset</button>
        </div>
        <span class="master-label">Master Scrub</span>
        <div class="scrub-row">
            <button id="prevFrameBtn" class="icon-btn" disabled>◀</button>
            <div class="jog-wheel master-jog-wheel" id="masterJogWheel"><div class="wheel-dot"></div></div>
            <button id="nextFrameBtn" class="icon-btn" disabled>▶</button>
        </div>
    </div>

    <!-- Single CTA: triggers the full pipeline -->
    <button id="analyseBtn" class="btn analyse-btn" disabled>Analyse Swings</button>

    <!-- Progress: shown during pipeline -->
    <div id="progressPanel" style="display:none">
        <div id="progressStep">Starting…</div>
        <div class="progress-track">
            <div id="progressFill" class="progress-fill"></div>
        </div>
    </div>

    <!-- Coaching feedback: shown after pipeline completes -->
    <div id="feedbackPanel" style="display:none">
        <h4>Coaching Feedback</h4>
        <div id="feedbackText"></div>
    </div>

    <!-- TensorFlow.js (pinned versions, order is critical) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.22.0/dist/tf-backend-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/tf-backend-wasm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

    <!-- App modules (order: pose → autosync → coaching → app) -->
    <script src="pose.js"></script>
    <script src="autosync.js"></script>
    <script src="coaching.js"></script>
    <script src="app.js"></script>
</body>
</html>
