<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golf Swing Sync</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SwingSync">

    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 10px; 
            background-color: #1c1c1e; 
            color: white;
            overflow-x: hidden; 
        }
        
        .video-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
        }
        .video-wrapper {
            width: 50%;
            display: flex;
            flex-direction: column;
            position: relative; 
        }
        
        canvas { 
            width: 100%; 
            border-radius: 8px; 
            background-color: #000;
        }
        
        .hidden-video {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 10px;
            height: 10px;
            z-index: -1;
        }
        
        /* Individual Video Micro Controls */
        .micro-scrub-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            justify-content: center;
        }
        .micro-btn {
            background-color: #3a3a3c;
            font-size: 12px;
            padding: 8px;
            flex: 0 0 32px;
            border-radius: 6px;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .micro-btn:active { background-color: #4c4c4e; }
        .micro-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .upload-section { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        input[type="file"] { display: none; }
        .btn {
            background-color: #0a84ff; 
            color: white; 
            padding: 10px 15px; 
            font-size: 14px; 
            font-weight: bold;
            border-radius: 8px; 
            cursor: pointer; 
            flex: 1;
            border: none;
        }
        .btn:active { background-color: #0060d1; }
        .btn:disabled { background-color: #555; color: #888; cursor: not-allowed; }
        
        .master-controls {
            margin-top: 20px;
            background-color: #2c2c2e;
            padding: 15px;
            border-radius: 12px;
        }
        
        .master-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        #timer {
            font-family: monospace;
            font-size: 28px;
            font-weight: bold;
            color: #32d74b; 
            margin: 0;
        }
        
        .reset-btn {
            background-color: #ff453a; 
            flex: 0 0 auto;
            padding: 8px 16px;
        }
        .reset-btn:active { background-color: #d70015; }

        .master-label {
            font-size: 14px;
            font-weight: bold;
            color: #ccc;
            margin-bottom: 10px;
            display: block;
        }
        
        /* Master Jog Wheel / Frame Scrub Row */
        .scrub-row {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }

        .icon-btn {
            background-color: #3a3a3c;
            font-size: 18px;
            padding: 10px;
            flex: 0 0 50px;
            border-radius: 8px;
            border: none;
            color: white;
            cursor: pointer;
        }
        .icon-btn:active { background-color: #4c4c4e; }
        .icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ── Jog wheel ── */
        .jog-wheel {
            position: relative;
            flex-shrink: 0;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, #606064, #3a3a3c 48%, #1a1a1c);
            border: 2px solid #505054;
            box-shadow:
                0 6px 18px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(255,255,255,0.12),
                inset 0 -2px 4px rgba(0,0,0,0.5);
            cursor: not-allowed;
            user-select: none;
            touch-action: none;
            opacity: 0.4;
            transition: opacity 0.2s, box-shadow 0.15s;
        }
        .jog-wheel.enabled {
            cursor: grab;
            opacity: 1;
        }
        .jog-wheel.enabled:active {
            cursor: grabbing;
            box-shadow:
                0 2px 8px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(255,255,255,0.12),
                inset 0 -2px 4px rgba(0,0,0,0.5);
        }
        .wheel-dot {
            position: absolute;
            top: 9px;
            left: calc(50% - 3px);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #0a84ff;
            box-shadow: 0 0 8px rgba(10,132,255,0.8);
        }
        .jog-wheel:not(.enabled) .wheel-dot {
            background: #555;
            box-shadow: none;
        }
        .master-jog-wheel {
            width: 90px;
            height: 90px;
        }
        .master-jog-wheel .wheel-dot {
            top: 11px;
        }

        /* ── Drawing overlay ── */
        .canvas-wrapper {
            position: relative;
            line-height: 0;
        }
        .draw-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            pointer-events: auto;
            cursor: grab;
            z-index: 2;
            background: transparent;
        }
        .draw-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            background-color: #2c2c2e;
            border-radius: 10px;
            padding: 10px 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .draw-btn {
            background-color: #3a3a3c;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .draw-btn:active { background-color: #4c4c4e; }
        .draw-btn.active { background-color: #0a84ff; }
        .draw-clear-btn { background-color: #ff453a; }
        .draw-clear-btn:active { background-color: #d70015; }
        .draw-toolbar input[type="color"] {
            width: 36px;
            height: 34px;
            border: none;
            border-radius: 6px;
            padding: 2px;
            background: #3a3a3c;
            cursor: pointer;
        }
        .draw-toolbar input[type="range"] {
            width: 70px;
            accent-color: #0a84ff;
        }
        .draw-label {
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <h3>Swing Compare</h3>
    
    <div class="upload-section">
        <label for="upload1" class="btn">Upload Swing 1</label>
        <input type="file" id="upload1" accept="video/*">
        
        <label for="upload2" class="btn">Upload Swing 2</label>
        <input type="file" id="upload2" accept="video/*">
    </div>
    
    <div class="video-container">
        <div class="video-wrapper">
            <div class="canvas-wrapper">
                <canvas id="canvas1"></canvas>
                <canvas id="drawCanvas1" class="draw-canvas"></canvas>
            </div>
            <video id="vid1" class="hidden-video" playsinline muted autoplay></video>
            <div class="micro-scrub-row">
                <button id="prevFrameBtn1" class="micro-btn" disabled>➖</button>
                <div class="jog-wheel" id="jogWheel1"><div class="wheel-dot"></div></div>
                <button id="nextFrameBtn1" class="micro-btn" disabled>➕</button>
            </div>
        </div>
        
        <div class="video-wrapper">
            <div class="canvas-wrapper">
                <canvas id="canvas2"></canvas>
                <canvas id="drawCanvas2" class="draw-canvas"></canvas>
            </div>
            <video id="vid2" class="hidden-video" playsinline muted autoplay></video>
            <div class="micro-scrub-row">
                <button id="prevFrameBtn2" class="micro-btn" disabled>➖</button>
                <div class="jog-wheel" id="jogWheel2"><div class="wheel-dot"></div></div>
                <button id="nextFrameBtn2" class="micro-btn" disabled>➕</button>
            </div>
        </div>
    </div>
    
    <div class="draw-toolbar">
        <button id="drawModeBtn" class="draw-btn">✏️ Draw</button>
        <input type="color" id="strokeColor" value="#ff3b30" title="Stroke color">
        <span class="draw-label">Size</span>
        <input type="range" id="strokeWidth" min="1" max="20" value="4" title="Stroke width">
        <button id="clearDrawBtn" class="draw-btn draw-clear-btn">✕ Clear</button>
        <button id="resetViewBtn" class="draw-btn">↺ Reset</button>
    </div>

    <div class="master-controls">
        <div class="master-header">
            <div id="timer">00:00.00</div>
            <button id="resetBtn" class="btn reset-btn" disabled>Reset</button>
        </div>
        
        <span class="master-label">Master Control (Macro & Micro Scrub)</span>
        
        <div class="scrub-row">
            <button id="prevFrameBtn" class="icon-btn" disabled>➖</button>
            <div class="jog-wheel master-jog-wheel" id="masterJogWheel"><div class="wheel-dot"></div></div>
            <button id="nextFrameBtn" class="icon-btn" disabled>➕</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
